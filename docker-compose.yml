# Local development stack. Production runs on AWS - see docs/deployment.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shero
      POSTGRES_PASSWORD: shero
      POSTGRES_DB: shero_bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shero -d shero_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://shero:shero@db:5432/shero_bot
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Apply migrations before serving, so a fresh container is usable.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
