<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Shero Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body class="flex h-full items-center justify-center bg-stone-100 px-4">
  <div class="w-full max-w-sm">
    <div class="mb-6 text-center">
      <div class="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-xl bg-[#b05c2e] text-lg font-bold text-white">S</div>
      <h1 class="text-xl font-semibold text-stone-900">Shero Home Food</h1>
      <p class="mt-1 text-sm text-stone-500">Ordering bot admin</p>
    </div>

    <form method="post" action="{{ url_for('admin_login') }}"
          class="space-y-4 rounded-2xl border border-stone-200 bg-white p-6 shadow-sm">
      {% if error %}
        <div class="rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800">
          {{ error }}
        </div>
      {% endif %}

      <div>
        <label for="email" class="mb-1.5 block text-sm font-medium text-stone-700">Email</label>
        <input id="email" name="email" type="email" required autofocus autocomplete="username"
               value="{{ email or '' }}"
               class="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm outline-none
                      focus:border-[#b05c2e] focus:ring-2 focus:ring-[#b05c2e]/20">
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-sm font-medium text-stone-700">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password"
               class="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm outline-none
                      focus:border-[#b05c2e] focus:ring-2 focus:ring-[#b05c2e]/20">
      </div>

      <button type="submit"
              class="w-full rounded-lg bg-[#b05c2e] py-2.5 text-sm font-semibold text-white
                     transition hover:bg-[#8f4726] focus:outline-none focus:ring-2 focus:ring-[#b05c2e]/40">
        Sign in
      </button>
    </form>

    <p class="mt-4 text-center text-xs text-stone-400">
      Authorised staff only. All actions are logged.
    </p>
  </div>
</body>
</html>
