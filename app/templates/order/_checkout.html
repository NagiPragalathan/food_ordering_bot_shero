{# Delivery check -> time -> total -> confirm. Shared by the menu page and the
   address-only page, so both place orders exactly the same way. Needs
   _sheet.html (SheroUI) and _address_book.html (the book). #}
<script>
window.SheroCheckout = function (ui, opts) {
  const { $, esc, money, toast, api, openSheet, busy } = ui;
  const onPlaced = (opts && opts.onPlaced) || function () {};
  let addressId = null;
  let slotId = null;
  let book = null;          // set by attach(): the book needs checkDelivery first

  const slotClass = 'rounded-xl border border-mist-200 bg-white px-2 py-2.5 text-[12px] leading-tight';
  const pickedClass = 'rounded-xl border-2 border-herb-600 bg-herb-500/10 px-2 py-2.5 text-[12px] ' +
                      'font-semibold leading-tight text-herb-700';
  const waIcon = '<svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.9-1.1-4.7-4.1-4.9-4.3-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.4.1.1.1.7-.1 1.3Z"/></svg>';

  async function checkDelivery(id) {
    if (!id) { toast('Choose a delivery address.'); return; }
    const done = busy($('check'), 'Checking delivery…');
    try {
      const data = await api('/address', { address_id: id });
      if (!data.ok) {
        if (data.out_of_area) { notHereYet(data.out_of_area); return; }
        toast(data.error); return;
      }

      if ($('area-note')) $('area-note').innerHTML = '';
      addressId = id;
      slotId = null;
      showDays(data);
      $('slots-wrap').classList.remove('hidden');
      $('slots-wrap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } catch (err) {
      toast('Could not check that address: ' + err.message);
    } finally {
      done();
    }
  }

  // --- Date, then time ------------------------------------------------------
  // Slots arrive with their day (in the kitchen's timezone). The customer
  // picks a day from a strip covering the week - days with nothing free show
  // as closed - then a time on that day.
  function showDays(data) {
    const byDate = {};
    data.slots.forEach(s => { (byDate[s.date] = byDate[s.date] || []).push(s); });
    const first = data.slots[0].date;
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(first + 'T12:00:00Z');
      d.setUTCDate(d.getUTCDate() + i);
      const key = d.toISOString().slice(0, 10);
      days.push({ key, weekday: d.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' }),
                  day: d.getUTCDate(), month: d.toLocaleDateString('en-US', { month: 'short', timeZone: 'UTC' }),
                  slots: byDate[key] || [] });
    }

    const box = $('slots');
    box.className = '';
    box.innerHTML =
      (data.lead_hours ? '<p class="mb-3 flex items-start gap-2 rounded-xl bg-mist-100 px-3 py-2 text-xs text-ink-700/80">' +
        '<span>🕒</span><span>Orders need <b>' + esc(String(Math.round(data.lead_hours))) + ' hours&rsquo; notice</b>. ' +
        'Earliest delivery: <b>' + esc(data.earliest) + '</b>.</span></p>' : '') +
      '<h4 class="mb-2 text-xs font-semibold uppercase tracking-wide text-ink-700/60">Choose a day</h4>' +
      '<div id="day-strip" class="-mx-1 flex gap-2 overflow-x-auto px-1 pb-2" role="listbox" aria-label="Delivery day"></div>' +
      '<h4 id="times-title" class="mb-2 mt-3 text-xs font-semibold uppercase tracking-wide text-ink-700/60">Choose a time</h4>' +
      '<div id="time-grid" class="grid grid-cols-2 gap-2"></div>';

    const strip = $('day-strip');
    days.forEach(d => {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.date = d.key;
      b.disabled = !d.slots.length;
      b.setAttribute('role', 'option');
      b.innerHTML =
        '<span class="block text-[11px] font-medium uppercase">' + esc(d.weekday) + '</span>' +
        '<span class="block text-xl font-bold leading-tight">' + d.day + '</span>' +
        '<span class="block text-[11px]">' + esc(d.month) + '</span>' +
        '<span class="mt-1 block text-[10px] font-semibold">' +
          (d.slots.length ? d.slots.length + ' time' + (d.slots.length > 1 ? 's' : '') : 'Closed') + '</span>';
      b.addEventListener('click', () => pickDay(d));
      strip.appendChild(b);
    });
    pickDay(days.find(d => d.slots.length));
  }

  const dayClass = 'w-[4.5rem] shrink-0 rounded-2xl border px-2 py-2 text-center transition ';
  function pickDay(day) {
    slotId = null;
    $('sheet-foot').innerHTML = '<button disabled class="w-full rounded-xl bg-mist-200 py-3 text-sm font-semibold ' +
      'text-ink-700/50">Choose a time</button>';
    Array.from($('day-strip').children).forEach(b => {
      const on = b.dataset.date === day.key;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.className = dayClass + (b.disabled
        ? 'cursor-not-allowed border-dashed border-mist-200 bg-mist-50 text-ink-700/30'
        : on ? 'border-herb-600 bg-herb-600 text-white shadow-md'
             : 'border-mist-200 bg-white text-ink-800 hover:border-herb-600');
      if (on) b.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
    });
    $('times-title').textContent = 'Choose a time · ' + day.weekday + ' ' + day.day + ' ' + day.month;

    const grid = $('time-grid');
    grid.innerHTML = '';
    day.slots.forEach(s => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = slotClass;
      b.innerHTML = esc(s.time) + (s.remaining === 1
        ? '<span class="mt-0.5 block text-[10px] font-semibold text-amber-700">Last one</span>' : '');
      b.addEventListener('click', () => {
        slotId = s.id;
        Array.from(grid.children).forEach(x => { x.className = slotClass; });
        b.className = pickedClass;
        $('sheet-foot').innerHTML =
          '<button id="go-summary" class="w-full rounded-xl bg-brand-500 py-3 text-sm font-semibold text-white">' +
          'See the total · ' + esc(day.weekday + ' ' + day.day + ' ' + day.month + ', ' + s.time.split(' - ')[0]) + '</button>';
        $('go-summary').addEventListener('click', showSummary);
      });
      grid.appendChild(b);
    });
  }

  // No kitchen delivers to this address: a clear panel in the sheet, where
  // the customer is choosing, with the way forward - not a passing toast.
  function notHereYet(info) {
    const box = $('area-note');
    if (!box) { toast('Sorry, we do not deliver to ' + info.address + ' yet.'); return; }
    $('slots-wrap') && $('slots-wrap').classList.add('hidden');
    const far = info.miles != null
      ? '<div class="mt-3 grid grid-cols-2 gap-2 text-center">' +
          '<div class="rounded-xl bg-white/80 px-2 py-2 ring-1 ring-amber-200">' +
            '<div class="text-lg font-bold tabular-nums text-amber-900">' + esc(fmtMiles(info.miles)) + '</div>' +
            '<div class="text-[11px] text-amber-800/80">to our nearest kitchen</div></div>' +
          '<div class="rounded-xl bg-white/80 px-2 py-2 ring-1 ring-amber-200">' +
            '<div class="text-lg font-bold tabular-nums text-amber-900">' +
              (info.range_miles != null ? esc(fmtMiles(info.range_miles)) : 'ZIP list') + '</div>' +
            '<div class="text-[11px] text-amber-800/80">' +
              (info.range_miles != null ? 'how far it delivers' : 'set delivery area') + '</div></div>' +
        '</div>'
      : '';
    box.innerHTML =
      '<div role="alert" class="area-note mt-4 overflow-hidden rounded-2xl border border-amber-200 bg-gradient-to-b from-amber-50 to-white">' +
        '<div class="flex gap-3 p-4">' +
          '<div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-amber-100 text-2xl">📍</div>' +
          '<div class="min-w-0">' +
            '<h3 class="text-[15px] font-bold text-ink-900">We do not deliver here yet</h3>' +
            '<p class="mt-0.5 text-[13px] leading-snug text-ink-700/80 [overflow-wrap:anywhere]">' +
              '<span class="font-semibold text-ink-800">' + esc(info.address) + '</span> is outside our delivery area.</p>' +
          '</div>' +
        '</div>' +
        '<div class="px-4">' + far + '</div>' +
        '<p class="px-4 pt-3 text-[13px] leading-snug text-ink-700/80">We are growing and hope to reach your area soon. ' +
          'Meanwhile, you can deliver to another address - a workplace, or a friend nearby.</p>' +
        (info.notified ? '<p class="mx-4 mt-3 flex items-center gap-2 rounded-lg bg-[#25D366]/10 px-3 py-2 text-xs font-medium text-[#128C7E]">' +
          waIcon + 'We have sent you the details on WhatsApp too.</p>' : '') +
        '<div class="flex gap-2 p-4">' +
          '<button type="button" id="area-new" class="flex-1 rounded-xl bg-brand-500 py-2.5 text-sm font-semibold text-white">+ Add a new address</button>' +
          '<button type="button" id="area-pick" class="flex-1 rounded-xl border border-mist-200 bg-white py-2.5 text-sm font-semibold text-ink-800">Choose another</button>' +
        '</div>' +
      '</div>';
    $('area-new').addEventListener('click', () => $('addr-new') && $('addr-new').click());
    $('area-pick').addEventListener('click', () => {
      box.innerHTML = '';
      $('sheet-body').scrollTo({ top: 0, behavior: 'smooth' });
    });
    box.firstChild.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function fmtMiles(m) {
    const n = Number(m);
    return (n >= 100 ? Math.round(n).toLocaleString() : n.toFixed(n < 10 ? 1 : 0)) + ' mi';
  }

  async function showSummary() {
    if (!slotId) { toast('Pick a delivery time.'); return; }
    const done = busy($('go-summary'), 'Working out your total…');
    try {
      const data = await api('/quote', { slot_id: slotId, address_id: addressId });
      if (!data.ok) { toast(data.error); return; }

      const rows = data.lines.map(l =>
        '<div class="flex justify-between py-1 text-sm"><span>' + l.quantity + ' × ' +
        esc(l.name) + '</span><span class="tabular-nums">' + money(l.line_total) + '</span></div>').join('');
      const row = (k, v) => '<div class="flex justify-between py-0.5 text-sm text-ink-700/80"><span>' +
        k + '</span><span class="tabular-nums">' + money(v) + '</span></div>';

      const place = book && book.selectedAddress();
      openSheet('Confirm your order',
        rows + '<hr class="my-2 border-mist-200">' +
        row('Subtotal', data.dish_total) + row('Delivery', data.delivery_fee) +
        row('Taxes &amp; fees', Number(data.extra_fees) + Number(data.tax)) +
        '<hr class="my-2 border-mist-200">' +
        '<div class="flex justify-between text-base font-bold"><span>Total</span>' +
        '<span class="tabular-nums">' + money(data.total) + '</span></div>' +
        '<div class="mt-4 space-y-2 rounded-xl bg-mist-100 p-3 text-sm">' +
          (place ? '<div class="flex gap-2"><span>📍</span><div><div class="text-xs text-ink-700/60">Deliver to · ' +
            esc(place.label) + '</div><div class="font-medium">' + esc(place.address_line1) +
            (place.apartment_unit ? ', ' + esc(place.apartment_unit) : '') + ' · ' + esc(place.postal_code) +
            '</div></div></div>' : '') +
          '<div class="flex gap-2"><span>🕒</span><div><div class="text-xs text-ink-700/60">Delivery time</div>' +
          '<div class="font-medium">' + esc(data.slot_label) + '</div></div></div>' +
        '</div>' +
        '<p class="mt-3 text-xs text-ink-700/60">Next, WhatsApp opens with this summary and a Pay Now button. ' +
        'You can still change the menu or the address there.</p>',
        '<button id="place" class="flex w-full items-center justify-center gap-2 rounded-xl bg-[#25D366] py-3 ' +
        'text-sm font-semibold text-white">' + waIcon + ' Confirm &amp; continue on WhatsApp</button>');

      $('place').addEventListener('click', placeOrder);
    } catch (err) {
      toast('Could not price your order: ' + err.message);
    } finally {
      done();
    }
  }

  async function placeOrder() {
    const done = busy($('place'), 'Placing your order…');
    try {
      const data = await api('/confirm', { slot_id: slotId, address_id: addressId });
      if (!data.ok) { toast(data.error); return; }

      openSheet('Order placed',
        '<div class="py-4 text-center">' +
        '<div class="text-4xl">✅</div>' +
        '<p class="mt-3 text-sm">Order <strong>' + esc(data.order_number) + '</strong></p>' +
        '<p class="mt-1 text-sm text-ink-700/80">Your order summary is on WhatsApp with a ' +
        '<strong>Pay Now</strong> button. Your slot is held for 30 minutes.</p>' +
        (data.whatsapp_url ? '<p class="mt-2 text-xs text-ink-700/60">Opening WhatsApp…</p>' : '') +
        '</div>',
        // WhatsApp first: that is where the summary, Pay Now, Change menu
        // and Update location are. Paying here stays possible.
        (data.whatsapp_url
          ? '<a href="' + esc(data.whatsapp_url) + '" class="flex w-full items-center justify-center gap-2 ' +
            'rounded-xl bg-[#25D366] py-3 text-center text-sm font-semibold text-white">' +
            waIcon + 'Go to WhatsApp</a>'
          : '') +
        '<a href="' + esc(data.pay_url) + '" class="mt-2 block w-full rounded-xl border border-mist-200 bg-white ' +
        'py-3 text-center text-sm font-semibold text-ink-800">Pay here instead</a>');

      onPlaced(data);
      // Straight on to the chat. The screen above stays as the fallback if
      // the browser does not follow a link it was not tapped on.
      if (data.whatsapp_url) setTimeout(() => { window.location.href = data.whatsapp_url; }, 1200);
    } catch (err) {
      toast('Could not place the order: ' + err.message);
    } finally {
      done();
    }
  }

  return { checkDelivery, attach: (b) => { book = b; } };
};
</script>
