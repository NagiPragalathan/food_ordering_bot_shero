{# Delivery check -> time -> total (with coupons) -> confirm. Shared by the
   menu page and the address-only page, so both place orders exactly the same
   way. Needs _sheet.html (SheroUI) and _address_book.html (the book). #}
<script>
window.SheroCheckout = function (ui, opts) {
  const { $, esc, money, toast, api, openSheet, busy } = ui;
  const onPlaced = (opts && opts.onPlaced) || function () {};
  let addressId = null;
  let slotId = null;
  let book = null;          // set by attach(): the book needs checkDelivery first
  let loyaltyPoints = 0;
  let loyaltyDiscount = '0.00';
  let expectedTotal = '';
  let quoteSequence = 0;
  let appliedCode = '';     // the coupon the total on screen includes; sent back at confirm

  const slotClass = 'rounded-xl border border-mist-200 bg-white px-2 py-2.5 text-[12px] leading-tight';
  const pickedClass = 'rounded-xl border-2 border-herb-600 bg-herb-500/10 px-2 py-2.5 text-[12px] ' +
                      'font-semibold leading-tight text-herb-700';
  const waIcon = '<svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.9-1.1-4.7-4.1-4.9-4.3-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.4.1.1.1.7-.1 1.3Z"/></svg>';
  const tagIcon = '<svg class="h-4 w-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0L3 13V3h10l7.6 7.6a2 2 0 010 2.8zM7.5 7.5h.01"/></svg>';

  async function checkDelivery(id) {
    if (!id) { toast('Choose a delivery address.'); return; }
    const done = busy($('check'), 'Checking delivery…');
    try {
      const data = await api('/address', { address_id: id });
      if (!data.ok) {
        if (data.out_of_area) { notHereYet(data.out_of_area); return; }
        toast(data.error); return;
      }

      if ($('area-note')) $('area-note').innerHTML = '';
      addressId = id;
      loyaltyPoints = 0;
      slotId = null;
      showDays(data);
      $('slots-wrap').classList.remove('hidden');
      $('slots-wrap').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    } catch (err) {
      toast('Could not check that address: ' + err.message);
    } finally {
      done();
    }
  }

  // --- Date, then time ------------------------------------------------------
  // Slots arrive with their day (in the kitchen's timezone). The customer
  // picks a day from a strip covering the week - days with nothing free show
  // as closed - then a time on that day.
  function showDays(data) {
    const byDate = {};
    data.slots.forEach(s => { (byDate[s.date] = byDate[s.date] || []).push(s); });
    const first = data.slots[0].date;
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(first + 'T12:00:00Z');
      d.setUTCDate(d.getUTCDate() + i);
      const key = d.toISOString().slice(0, 10);
      days.push({ key, weekday: d.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' }),
                  day: d.getUTCDate(), month: d.toLocaleDateString('en-US', { month: 'short', timeZone: 'UTC' }),
                  slots: byDate[key] || [] });
    }

    const box = $('slots');
    box.className = '';
    box.innerHTML =
      (data.lead_hours ? '<p class="mb-3 flex items-start gap-2 rounded-xl bg-mist-100 px-3 py-2 text-xs text-ink-700/80">' +
        '<span>🕒</span><span>Orders need <b>' + esc(String(Math.round(data.lead_hours))) + ' hours&rsquo; notice</b>. ' +
        'Earliest delivery: <b>' + esc(data.earliest) + '</b>.</span></p>' : '') +
      '<h4 class="mb-2 text-xs font-semibold uppercase tracking-wide text-ink-700/60">Choose a day</h4>' +
      '<div id="day-strip" class="-mx-1 flex gap-2 overflow-x-auto px-1 pb-2" role="listbox" aria-label="Delivery day"></div>' +
      '<h4 id="times-title" class="mb-2 mt-3 text-xs font-semibold uppercase tracking-wide text-ink-700/60">Choose a time</h4>' +
      '<div id="time-grid" class="grid grid-cols-2 gap-2"></div>';

    const strip = $('day-strip');
    days.forEach(d => {
      const b = document.createElement('button');
      b.type = 'button';
      b.dataset.date = d.key;
      b.disabled = !d.slots.length;
      b.setAttribute('role', 'option');
      b.innerHTML =
        '<span class="block text-[11px] font-medium uppercase">' + esc(d.weekday) + '</span>' +
        '<span class="block text-xl font-bold leading-tight">' + d.day + '</span>' +
        '<span class="block text-[11px]">' + esc(d.month) + '</span>' +
        '<span class="mt-1 block text-[10px] font-semibold">' +
          (d.slots.length ? d.slots.length + ' time' + (d.slots.length > 1 ? 's' : '') : 'Closed') + '</span>';
      b.addEventListener('click', () => pickDay(d));
      strip.appendChild(b);
    });
    pickDay(days.find(d => d.slots.length));
  }

  const dayClass = 'w-[4.5rem] shrink-0 rounded-2xl border px-2 py-2 text-center transition ';
  function pickDay(day) {
    slotId = null;
    $('sheet-foot').innerHTML = '<button disabled class="w-full rounded-xl bg-mist-200 py-3 text-sm font-semibold ' +
      'text-ink-700/50">Choose a time</button>';
    Array.from($('day-strip').children).forEach(b => {
      const on = b.dataset.date === day.key;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      b.className = dayClass + (b.disabled
        ? 'cursor-not-allowed border-dashed border-mist-200 bg-mist-50 text-ink-700/30'
        : on ? 'border-herb-600 bg-herb-600 text-white shadow-md'
             : 'border-mist-200 bg-white text-ink-800 hover:border-herb-600');
      if (on) b.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
    });
    $('times-title').textContent = 'Choose a time · ' + day.weekday + ' ' + day.day + ' ' + day.month;

    const grid = $('time-grid');
    grid.innerHTML = '';
    day.slots.forEach(s => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = slotClass;
      b.innerHTML = esc(s.time) + (s.remaining === 1
        ? '<span class="mt-0.5 block text-[10px] font-semibold text-amber-700">Last one</span>' : '');
      b.addEventListener('click', () => {
        slotId = s.id;
        Array.from(grid.children).forEach(x => { x.className = slotClass; });
        b.className = pickedClass;
        $('sheet-foot').innerHTML =
          '<button id="go-summary" class="w-full rounded-xl bg-brand-500 py-3 text-sm font-semibold text-white">' +
          'See the total · ' + esc(day.weekday + ' ' + day.day + ' ' + day.month + ', ' + s.time.split(' - ')[0]) + '</button>';
        $('go-summary').addEventListener('click', () => showSummary($('go-summary')));
      });
      grid.appendChild(b);
    });
  }

  // No kitchen delivers to this address: a clear panel in the sheet, where
  // the customer is choosing, with the way forward - not a passing toast.
  function notHereYet(info) {
    const box = $('area-note');
    if (!box) { toast('Sorry, we do not deliver to ' + info.address + ' yet.'); return; }
    $('slots-wrap') && $('slots-wrap').classList.add('hidden');
    const far = info.miles != null
      ? '<div class="mt-3 grid grid-cols-2 gap-2 text-center">' +
          '<div class="rounded-xl bg-white/80 px-2 py-2 ring-1 ring-amber-200">' +
            '<div class="text-lg font-bold tabular-nums text-amber-900">' + esc(fmtMiles(info.miles)) + '</div>' +
            '<div class="text-[11px] text-amber-800/80">to our nearest kitchen</div></div>' +
          '<div class="rounded-xl bg-white/80 px-2 py-2 ring-1 ring-amber-200">' +
            '<div class="text-lg font-bold tabular-nums text-amber-900">' +
              (info.range_miles != null ? esc(fmtMiles(info.range_miles)) : 'ZIP list') + '</div>' +
            '<div class="text-[11px] text-amber-800/80">' +
              (info.range_miles != null ? 'how far it delivers' : 'set delivery area') + '</div></div>' +
        '</div>'
      : '';
    box.innerHTML =
      '<div role="alert" class="area-note mt-4 overflow-hidden rounded-2xl border border-amber-200 bg-gradient-to-b from-amber-50 to-white">' +
        '<div class="flex gap-3 p-4">' +
          '<div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-amber-100 text-2xl">📍</div>' +
          '<div class="min-w-0">' +
            '<h3 class="text-[15px] font-bold text-ink-900">We do not deliver here yet</h3>' +
            '<p class="mt-0.5 text-[13px] leading-snug text-ink-700/80 [overflow-wrap:anywhere]">' +
              '<span class="font-semibold text-ink-800">' + esc(info.address) + '</span> is outside our delivery area.</p>' +
          '</div>' +
        '</div>' +
        '<div class="px-4">' + far + '</div>' +
        '<p class="px-4 pt-3 text-[13px] leading-snug text-ink-700/80">We are growing and hope to reach your area soon. ' +
          'Meanwhile, you can deliver to another address - a workplace, or a friend nearby.</p>' +
        (info.notified ? '<p class="mx-4 mt-3 flex items-center gap-2 rounded-lg bg-[#25D366]/10 px-3 py-2 text-xs font-medium text-[#128C7E]">' +
          waIcon + 'We have sent you the details on WhatsApp too.</p>' : '') +
        '<div class="flex gap-2 p-4">' +
          '<button type="button" id="area-new" class="flex-1 rounded-xl bg-brand-500 py-2.5 text-sm font-semibold text-white">+ Add a new address</button>' +
          '<button type="button" id="area-pick" class="flex-1 rounded-xl border border-mist-200 bg-white py-2.5 text-sm font-semibold text-ink-800">Choose another</button>' +
        '</div>' +
      '</div>';
    $('area-new').addEventListener('click', () => $('addr-new') && $('addr-new').click());
    $('area-pick').addEventListener('click', () => {
      box.innerHTML = '';
      $('sheet-body').scrollTo({ top: 0, behavior: 'smooth' });
    });
    box.firstChild.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function fmtMiles(m) {
    const n = Number(m);
    return (n >= 100 ? Math.round(n).toLocaleString() : n.toFixed(n < 10 ? 1 : 0)) + ' mi';
  }

  // Price the order and show the summary. `button` shows the wait; `keep`
  // keeps the scroll position when the sheet is only being refreshed (a
  // coupon applied or removed), so the customer stays where they were.
  async function showSummary(button, keep) {
    if (!slotId) { toast('Pick a delivery time.'); return null; }
    const sequence = ++quoteSequence;
    const done = busy(button, keep ? 'Updating…' : 'Working out your total…');
    try {
      let data = await api('/quote', { slot_id: slotId, address_id: addressId, loyalty_points: loyaltyPoints });
      if (!data.ok && loyaltyPoints > 0) {
        toast(data.error);
        loyaltyPoints = 0;
        data = await api('/quote', { slot_id: slotId, address_id: addressId, loyalty_points: 0 });
      }
      if (sequence !== quoteSequence) return null;
      if (!data.ok) { toast(data.error); return null; }
      const scroll = $('sheet-body').scrollTop;
      renderSummary(data);
      if (keep) $('sheet-body').scrollTop = scroll;
      return data;
    } catch (err) {
      toast('Could not price your order: ' + err.message);
      return null;
    } finally {
      done();
    }
  }

  function renderSummary(data) {
    const coupon = data.coupon;
    loyaltyPoints = data.loyalty ? data.loyalty.selected_points : 0;
    loyaltyDiscount = data.loyalty ? data.loyalty.discount : '0.00';
    expectedTotal = Number(data.total).toFixed(2);
    appliedCode = coupon && coupon.applied ? coupon.code : '';

    const rows = data.lines.map(l =>
      '<div class="flex justify-between gap-3 py-1 text-sm"><span>' + l.quantity + ' × ' +
      esc(l.name) + '</span><span class="tabular-nums">' + money(l.line_total) + '</span></div>').join('');
    const row = (k, v) => '<div class="flex justify-between py-0.5 text-sm text-ink-700/80"><span>' +
      k + '</span><span class="tabular-nums">' + money(v) + '</span></div>';

    const discountRow = data.discount > 0
      ? '<div class="flex justify-between py-0.5 text-sm font-semibold text-herb-700"><span>Coupon (' +
        esc(coupon.code) + ')</span><span class="tabular-nums">−' + money(data.discount) + '</span></div>'
      : '';
    const totalRow =
      '<div class="flex items-baseline justify-between text-base font-bold"><span>Total</span><span class="tabular-nums">' +
      (data.discount > 0 ? '<span class="mr-1.5 text-xs font-medium text-ink-700/45 line-through">' +
        money(data.total_before_discount) + '</span>' : '') + money(data.total) + '</span></div>';
    const savedBanner = data.discount > 0
      ? '<div class="mt-2 flex items-center justify-center gap-1.5 rounded-xl bg-herb-500/10 px-3 py-2 text-sm font-semibold text-herb-700">' +
        '🎉 You save ' + money(data.saving || data.discount) + ' on this order</div>'
      : '';

    const place = book && book.selectedAddress();
    openSheet('Confirm your order',
      rows + '<hr class="my-2 border-mist-200">' +
      couponBlock(data) + loyaltyBlock(data.loyalty) +
      '<hr class="my-2 border-mist-200">' +
      row('Subtotal', data.dish_total) + row('Delivery', data.delivery_fee) +
      row('Taxes &amp; fees', Number(data.extra_fees) + Number(data.tax)) +
      discountRow + (Number(loyaltyDiscount) > 0 ? '<div class="flex justify-between py-0.5 text-sm font-semibold text-herb-700"><span>Loyalty (' + loyaltyPoints + ' points)</span><span>-' + money(Number(loyaltyDiscount)) + '</span></div>' : '') +
      '<hr class="my-2 border-mist-200">' + totalRow + savedBanner +
      '<div class="mt-4 space-y-2 rounded-xl bg-mist-100 p-3 text-sm">' +
        (place ? '<div class="flex gap-2"><span>📍</span><div><div class="text-xs text-ink-700/60">Deliver to · ' +
          esc(place.label) + '</div><div class="font-medium">' + esc(place.address_line1) +
          (place.apartment_unit ? ', ' + esc(place.apartment_unit) : '') + ' · ' + esc(place.postal_code) +
          '</div></div></div>' : '') +
        '<div class="flex gap-2"><span>🕒</span><div><div class="text-xs text-ink-700/60">Delivery time</div>' +
        '<div class="font-medium">' + esc(data.slot_label) + '</div></div></div>' +
      '</div>' +
      '<p class="mt-3 text-xs text-ink-700/60">Next, WhatsApp opens with this summary and a Pay Now button. ' +
      'You can still change the menu or the address there.</p>',
      '<button id="place" class="flex w-full items-center justify-center gap-2 rounded-xl bg-[#25D366] py-3 ' +
      'text-sm font-semibold text-white">' + waIcon + ' Confirm &amp; pay ' + money(data.total) + ' on WhatsApp</button>');

    $('place').addEventListener('click', placeOrder);
    wireCoupons();
    wireLoyalty();
  }

  function loyaltyBlock(info) {
    if (!info || !info.enabled) return '';
    return '<section class="my-3 rounded-xl border border-herb-600/30 bg-herb-500/10 p-3">' +
      '<h4 class="font-semibold">' + esc(info.name) + '</h4>' +
      '<p class="my-1 text-sm">Available: <b>' + info.balance + ' points</b>. Up to ' + info.max_points +
      ' points on this order. One point = ' + esc(info.currency) + ' ' + esc(info.point_value) + '.</p>' +
      '<p class="mb-2 text-xs">Minimum ' + info.minimum_points + '; spend in steps of ' + info.step +
      '. Points are held until you pay or your payment link expires.</p>' +
      '<form id="loyalty-form" class="flex flex-wrap gap-2"><input id="loyalty-input" aria-label="Points to redeem" type="number" min="0" max="' +
      info.max_points + '" step="' + info.step + '" value="' + info.selected_points +
      '" class="w-28 rounded-lg border p-2"><button class="rounded-lg border bg-white px-3">Apply points</button>' +
      '<button type="button" id="loyalty-max" class="rounded-lg border bg-white px-3">Use maximum</button>' +
      '<button type="button" id="loyalty-clear" class="rounded-lg border bg-white px-3">Remove</button></form>' +
      '<button type="button" id="loyalty-history" class="mt-2 text-xs underline">My points history</button>' +
      '<div id="loyalty-history-content" class="mt-2 text-xs"></div></section>';
  }

  function wireLoyalty() {
    if (!$('loyalty-form')) return;
    const update = async (value) => {
      if (!Number.isSafeInteger(value) || value < 0) { toast('Enter a whole number of points.'); return; }
      const old = loyaltyPoints;
      loyaltyPoints = value;
      if (!await showSummary(null, true)) loyaltyPoints = old;
    };
    $('loyalty-form').addEventListener('submit', e => { e.preventDefault(); update(Number($('loyalty-input').value)); });
    $('loyalty-max').addEventListener('click', () => update(Number($('loyalty-input').max)));
    $('loyalty-clear').addEventListener('click', () => update(0));
    $('loyalty-history').addEventListener('click', async () => {
      try {
        const info = await api('/loyalty');
        if (!info.ok) { toast(info.error); return; }
        $('loyalty-history-content').innerHTML = '<p>' + esc(info.tier) + ' / ' + info.eligible_orders + ' eligible orders</p>' +
          info.entries.slice(0, 10).map(e => '<p>' + esc(e.date.slice(0, 10)) + ' | ' + esc(e.kind) + ' | ' + (e.points > 0 ? '+' : '') + e.points + ' points</p>').join('');
      } catch (err) { toast('Could not load points history.'); }
    });
  }

  // --- coupons ----------------------------------------------------------------
  function couponBlock(data) {
    const c = data.coupon;
    let html = '<div id="coupon-box" class="py-1">';
    html += '<div class="mb-2 flex items-center gap-1.5 text-sm font-semibold">' + tagIcon + 'Offers &amp; coupons</div>';
    if (data.coupon_notice) {
      html += '<p class="mb-2 rounded-lg bg-accent-50 px-3 py-2 text-xs text-accent-700">' + esc(data.coupon_notice) + '</p>';
    }

    if (c) {
      // The applied code: what it took off, or why not yet.
      html += '<div class="flex items-center gap-3 rounded-xl border px-3 py-2.5 ' +
        (c.applied ? 'border-herb-600/40 bg-herb-500/10' : 'border-amber-300 bg-amber-50') + '">' +
        '<span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full ' +
          (c.applied ? 'bg-herb-600 text-white' : 'bg-amber-400 text-white') + '">' +
          (c.applied ? '✓' : '!') + '</span>' +
        '<div class="min-w-0 flex-1">' +
          '<div class="text-sm font-bold tracking-wide">' + esc(c.code) +
            '<span class="ml-1.5 text-xs font-medium text-ink-700/70">' + esc(c.headline) + '</span></div>' +
          '<div class="text-xs ' + (c.applied ? 'text-herb-700' : 'text-amber-800') + '">' +
            (c.applied ? 'Applied · ' + money(c.saving) + ' off' : esc(c.message)) + '</div>' +
        '</div>' +
        '<button id="coupon-remove" class="shrink-0 rounded-lg px-2 py-1 text-xs font-semibold text-accent-600 hover:bg-white/70">Remove</button>' +
      '</div>';
    } else {
      html += '<form id="coupon-form" class="flex gap-2" autocomplete="off">' +
        '<input id="coupon-input" placeholder="Enter coupon code" maxlength="32" autocapitalize="characters" spellcheck="false" ' +
          'aria-label="Coupon code" class="min-w-0 flex-1 rounded-xl border border-mist-200 bg-white px-3 py-2.5 text-sm font-semibold ' +
          'uppercase tracking-wide outline-none placeholder:font-normal placeholder:normal-case placeholder:tracking-normal ' +
          'focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20">' +
        '<button id="coupon-apply" class="shrink-0 rounded-xl bg-brand-500 px-4 text-sm font-semibold text-white hover:bg-brand-600">Apply</button>' +
      '</form>' +
      '<p id="coupon-error" class="mt-1.5 hidden text-xs text-accent-600" role="alert"></p>';
    }

    // Offers the customer could pick instead, best first.
    const offers = (data.offers || []).filter(o => !c || o.code !== c.code);
    if (offers.length) {
      const card = (o) =>
        '<div class="flex overflow-hidden rounded-xl border ' + (o.eligible ? 'border-brand-200' : 'border-mist-200 opacity-80') + ' bg-white">' +
          '<div class="flex w-16 shrink-0 items-center justify-center px-1 py-2 text-center text-[10px] font-extrabold uppercase leading-tight text-white ' +
            (o.eligible ? 'bg-brand-500' : 'bg-ink-700/35') + '">' + esc(o.tag) + '</div>' +
          '<div class="min-w-0 flex-1 px-3 py-2">' +
            '<div class="flex items-start justify-between gap-2">' +
              '<div class="min-w-0"><div class="truncate text-sm font-semibold">' + esc(o.title) + '</div>' +
              '<div class="text-xs text-ink-700/70">' + esc(o.description || o.headline) + '</div></div>' +
              '<button class="offer-apply shrink-0 rounded-lg border border-brand-500 px-2.5 py-1 text-xs font-semibold text-brand-600 hover:bg-brand-50" ' +
                'data-code="' + esc(o.code) + '">Apply</button>' +
            '</div>' +
            '<div class="mt-1 flex flex-wrap items-center gap-x-2 gap-y-0.5 text-[11px]">' +
              '<span class="rounded border border-dashed border-brand-300 px-1.5 font-mono font-bold tracking-wider text-brand-700">' + esc(o.code) + '</span>' +
              (o.eligible
                ? (o.saving ? '<span class="font-semibold text-herb-700">Save ' + money(o.saving) + '</span>' : '')
                : '<span class="text-amber-700">' + esc(o.hint) + '</span>') +
              (terms(o).length ? '<span class="text-ink-700/50">' + esc(terms(o).join(' · ')) + '</span>' : '') +
            '</div>' +
          '</div>' +
        '</div>';
      const first = offers.slice(0, 2).map(card).join('');
      const rest = offers.slice(2).map(card).join('');
      html += '<div class="mt-2.5 space-y-2">' + first + '</div>';
      if (rest) {
        html += '<details class="mt-2"><summary class="cursor-pointer text-xs font-semibold text-brand-600">' +
                'See ' + (offers.length - 2) + ' more offer' + (offers.length - 2 === 1 ? '' : 's') + '</summary>' +
                '<div class="mt-2 space-y-2">' + rest + '</div></details>';
      }
    }
    return html + '</div>';
  }

  // The small print; "Min order" is left out where the hint already says it.
  const terms = (o) => o.eligible ? o.terms : o.terms.filter(t => !t.startsWith('Min order'));

  function couponError(message) {
    const el = $('coupon-error');
    if (!el) { toast(message); return; }
    el.textContent = message;
    el.classList.remove('hidden');
    const input = $('coupon-input');
    if (input) { input.classList.add('border-accent-500'); input.focus(); }
  }

  async function applyCoupon(code, button) {
    code = String(code || '').replace(/\s+/g, '').toUpperCase();
    if (!code) { couponError('Enter a coupon code.'); return; }
    const done = busy(button, 'Applying…');
    try {
      const res = await api('/coupon', { code: code });
      if (!res.ok) { couponError(res.error); return; }
      loyaltyPoints = 0; // Coupon changes require a fresh, explicit points choice.
      const data = await showSummary(null, true);
      if (data && data.coupon) {
        toast(data.coupon.applied
          ? '🎉 ' + data.coupon.code + ' applied - you save ' + money(data.saving || data.coupon.saving)
          : data.coupon.code + ' saved. ' + data.coupon.message, 'ok');
      }
    } catch (err) {
      couponError('Could not apply that code: ' + err.message);
    } finally {
      done();
    }
  }

  async function removeCoupon(button) {
    const done = busy(button, '…');
    try {
      await api('/coupon/remove', {});
      await showSummary(null, true);
    } catch (err) {
      toast('Could not remove the coupon: ' + err.message);
    } finally {
      done();
    }
  }

  function wireCoupons() {
    const form = $('coupon-form');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        applyCoupon($('coupon-input').value, $('coupon-apply'));
      });
      $('coupon-input').addEventListener('input', () => {
        $('coupon-error').classList.add('hidden');
        $('coupon-input').classList.remove('border-accent-500');
      });
    }
    const remove = $('coupon-remove');
    if (remove) remove.addEventListener('click', () => removeCoupon(remove));
    document.querySelectorAll('#coupon-box .offer-apply').forEach(b =>
      b.addEventListener('click', () => applyCoupon(b.dataset.code, b)));
  }

  async function placeOrder() {
    const done = busy($('place'), 'Placing your order…');
    try {
      const data = await api('/confirm', { slot_id: slotId, address_id: addressId,
                                           coupon_code: appliedCode, loyalty_points: loyaltyPoints,
                                           loyalty_discount: loyaltyDiscount, expected_total: expectedTotal });
      if (!data.ok) {
        toast(data.error);
        // The coupon or total changed since it was shown: show the new one.
        if (data.requote) { done(); await showSummary(null, true); }
        return;
      }

      openSheet('Order placed',
        '<div class="py-4 text-center">' +
        '<div class="text-4xl">✅</div>' +
        '<p class="mt-3 text-sm">Order <strong>' + esc(data.order_number) + '</strong></p>' +
        (data.discount > 0
          ? '<p class="mx-auto mt-2 inline-block rounded-full bg-herb-500/10 px-3 py-1 text-xs font-semibold text-herb-700">' +
            esc(data.coupon || 'Rewards') + ' saved you ' + money(data.discount) + '</p>'
          : '') +
        '<p class="mt-2 text-sm text-ink-700/80">Your order summary is on WhatsApp with a ' +
        '<strong>Pay Now</strong> button for ' + money(data.total) + '. Your slot is held for 30 minutes.</p>' +
        (data.whatsapp_url ? '<p class="mt-2 text-xs text-ink-700/60">Opening WhatsApp…</p>' : '') +
        '</div>',
        // WhatsApp first: that is where the summary, Pay Now, Change menu
        // and Update location are. Paying here stays possible.
        (data.whatsapp_url
          ? '<a href="' + esc(data.whatsapp_url) + '" class="flex w-full items-center justify-center gap-2 ' +
            'rounded-xl bg-[#25D366] py-3 text-center text-sm font-semibold text-white">' +
            waIcon + 'Go to WhatsApp</a>'
          : '') +
        '<a href="' + esc(data.pay_url) + '" class="mt-2 block w-full rounded-xl border border-mist-200 bg-white ' +
        'py-3 text-center text-sm font-semibold text-ink-800">Pay here instead</a>');

      onPlaced(data);
      // Straight on to the chat. The screen above stays as the fallback if
      // the browser does not follow a link it was not tapped on.
      if (data.whatsapp_url) setTimeout(() => { window.location.href = data.whatsapp_url; }, 1200);
    } catch (err) {
      toast('Could not place the order: ' + err.message);
    } finally {
      done();
    }
  }

  return { checkDelivery, attach: (b) => { book = b; } };
};
</script>
