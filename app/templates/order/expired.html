<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link expired</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex min-h-screen items-center justify-center bg-stone-100 px-4 text-stone-900">
  <div class="max-w-sm rounded-2xl border border-stone-200 bg-white p-8 text-center">
    <h1 class="text-lg font-semibold">This ordering link has expired</h1>
    <p class="mt-2 text-sm text-stone-600">
      Links stay valid for a few hours so they cannot be reused by someone else.
    </p>
    <p class="mt-4 text-sm text-stone-600">
      Send us <strong>menu</strong> on WhatsApp and we will send a fresh one.
    </p>
  </div>
</body>
</html>
