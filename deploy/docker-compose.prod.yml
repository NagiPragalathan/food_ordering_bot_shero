# Production on one AWS EC2 server - see docs/aws-hosting-guide.pdf.
#
#   api    the bot (FastAPI). Applies database migrations, then serves.
#   caddy  HTTPS in front of it. Gets and renews the TLS certificate for
#          $DOMAIN by itself (ports 80 and 443 must be open to the internet).
#
# The database is the SQLite file data/shero.db on this server's disk
# (DATABASE_URL=sqlite+aiosqlite:////app/data/shero.db in .env).
#
# Run from the project root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
services:
  api:
    build: ..
    env_file: ../.env
    restart: unless-stopped
    # Migrations first, so a new version never serves against an old schema.
    # --proxy-headers: links the bot builds use https://$DOMAIN, not the
    # internal http address Caddy forwards to. Kept as one line on purpose:
    # a line break inside the sh -c string ends the command there, and the
    # flags after it were silently dropped (forms then posted to http://).
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]
    volumes:
      # The database file (shero.db) and the dish photos (media/) live on the
      # server's disk, so restarts and new versions keep them. Owned by uid
      # 10001, the container's user.
      - ../data:/app/data
    expose:
      - "8000"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. order.sherohomefood.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
